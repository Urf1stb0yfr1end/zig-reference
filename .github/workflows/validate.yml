name: validate
permissions:
  contents: write
on:
  push:
  pull_request:
jobs:
  contracts-and-zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -r tools/requirements.txt
      - run: python3 tools/python-environment.py --check
      - name: Refresh Batch 24A validation evidence once
        if: github.event_name == 'push' && github.ref_name == 'codex/implement-rv64-linux-initial-process-stack-planner' && github.event.head_commit.message == 'Temporarily refresh Batch 24A validation evidence'
        run: |
          python3 tools/record-validation.py --level all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generated/validation/modules.json
          git commit -m 'Refresh Batch 24A validation evidence'
          git push origin HEAD:${GITHUB_REF_NAME}
      - run: python3 tools/format-module-contracts.py --check
      - run: zig fmt --check build.zig projects recipes conformance
      - run: zig build check
      - run: python3 tools/build-repository-index.py --check
      - run: python3 tools/build-dependency-graphs.py --check
      - run: PYTHONDONTWRITEBYTECODE=1 python3 tools/check-command-reference.py --check
      - run: zig build smoke
      - run: zig build recipes
      - run: zig build conformance
      - run: zig build property
      - run: zig build fuzz-smoke
      - run: zig build differential
      - run: zig build test
      - run: zig build validate-repository
      - run: python3 tools/check-repository-policy.py
      - name: Static secret pattern check
        run: '! git grep -nE "(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16})"'
