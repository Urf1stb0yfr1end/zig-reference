name: validate
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  contracts-and-zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - run: python3 -m pip install -r tools/requirements.txt
      - run: python3 tools/format-module-contracts.py --check
      - run: zig fmt --check build.zig projects recipes conformance
      - run: zig build check
      - run: python3 tools/build-repository-index.py --check
      - run: python3 tools/build-dependency-graphs.py --check
      - run: python3 tools/build-repository-database.py --check
      - run: zig build smoke
      - run: zig build recipes
      - run: zig build conformance
      - run: zig build property
      - run: zig build fuzz-smoke
      - run: zig build differential
      - run: zig build test
      - run: zig build validate-repository
      - run: python3 tools/check-repository-policy.py
      - name: Static secret pattern check
        run: '! git grep -nE "(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16})"'
